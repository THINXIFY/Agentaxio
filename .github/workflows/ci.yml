name: CI

# Runs on every pull request and on every push to main. Read-only: it never deploys, publishes or needs a secret.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real PostgreSQL 17 for the backend integration tests (nothing is mocked). Two servers: the second is used by the
    # one test that runs the local-setup script, which rotates the passwords of the cluster-level roles. The passwords
    # below belong to throw-away containers that exist only for this job; they protect nothing.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres-isolated:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AXO_TEST_ADMIN_URL: postgres://postgres:ci-throwaway-not-a-secret@localhost:5432/postgres
      AXO_TEST_ISOLATED_ADMIN_URL: postgres://postgres:ci-throwaway-not-a-secret@localhost:5433/postgres
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The exact pnpm version comes from "packageManager" in the root package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Vitest (web, contracts, policy, API with real PostgreSQL)
        run: pnpm test

      - name: Production build
        run: pnpm build

  live-e2e:
    name: Live dashboard end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The live-mode website, the agent and management APIs, the trusted executor and the mock CRM, against a real
    # PostgreSQL 17 and the real OpenID Connect flow (a protocol test double stands in for the identity provider, which
    # is NOT proof of interoperability with a real one). The script signs in as three invented people and checks, over
    # HTTP, the golden path and the security refusals: self-approval, wrong fingerprint, viewer, CSRF, Origin.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AXO_STACK_ADMIN_URL: postgres://postgres:ci-throwaway-not-a-secret@localhost:5432/postgres
      AXO_API_URL: http://127.0.0.1:8788
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Production build of the website in live mode
        run: pnpm --filter @agentaxio/web build

      - name: Start the backend stack
        run: |
          pnpm --filter @agentaxio/api dev:stack > stack.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/v1/me || true)
            [ "$code" = "401" ] && exit 0
            sleep 2
          done
          echo "backend stack did not start"; cat stack.log; exit 1

      - name: Start the website
        run: |
          pnpm --filter @agentaxio/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/dashboard || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "website did not start"; cat web.log; exit 1

      - name: Golden path and security refusals over HTTP
        run: node apps/api/test/support/live-flow.mjs

      - name: Logs on failure
        if: failure()
        run: |
          echo "--- stack.log"; cat stack.log || true
          echo "--- web.log"; cat web.log || true

  repo-hygiene:
    name: Secrets and environment files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: No environment files or key material are tracked
        run: |
          set -u
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)
          keys=$(git ls-files | grep -E '\.(pem|key|p12|pfx|jks|keystore)$|(^|/)(id_rsa|id_ed25519)' || true)
          if [ -n "$bad$keys" ]; then
            echo "Tracked files that must never be committed:"
            echo "$bad"
            echo "$keys"
            exit 1
          fi
          echo "No tracked .env files (other than .env.example) or key files."

      - name: No obvious secrets in tracked files
        run: |
          set -u
          pattern='sk-[A-Za-z0-9_-]{20,}|sk_live_|ghp_[A-Za-z0-9]{20,}|github_pat_|gho_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|xox[abp]-[0-9A-Za-z-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|_authToken'
          if git grep -InE "$pattern" -- . ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Possible secret found above."
            exit 1
          fi
          echo "No obvious secrets found."
