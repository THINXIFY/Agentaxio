packages:
  - "apps/*"
  - "packages/*"

# Dependency install scripts are denied by default (supply-chain hygiene).
# unrs-resolver ships prebuilt binaries as optional dependencies; its postinstall is only a fallback.
allowBuilds:
  # Prebuilt PostgreSQL 17 binaries for local tests; the postinstall only re-creates symlinks on macOS/Linux.
  '@embedded-postgres/windows-x64': false
  # esbuild (via tsx) ships its binary as an optional platform package; the postinstall is only a fallback.
  esbuild: false
  unrs-resolver: false
